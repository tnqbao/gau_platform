apiVersion: v1
kind: ConfigMap
metadata:
  name: gau-${service-name}-config
  namespace: gau-${ENV}-env
  labels:
    app: gau-platform
    env: ${ENV}
  data:
    
    # RABBITMQ_HOST: ${RABBITMQ_HOST}
    # RABBITMQ_PORT: ${RABBITMQ_PORT}
    # RABBITMQ_USER: ${RABBITMQ_USER}
    # RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gau-account-service
  namespace: gau-${ENV}-env
  labels:
    app: gau-platform
    env: ${ENV}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gau-account-service
  template:
    metadata:
      labels:
        app: gau-account-service
    spec:
      containers:
        - name: gau-account-service
          image: tnqbao/gau-account-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gau-${service-name}-name
#          command: [ "/app/entrypoint.sh", "api" ]
#          resources:
#            requests:
#              memory: "512Mi"
#              cpu: "0.5"
#            limits:
#              memory: "1Gi"
#              cpu: "2"
---

apiVersion: v1
kind: Service
metadata:
  name: gau-account-service
  namespace: gau-{ENV}-env
  labels:
    app: gau-platform
    env: ${ENV}
spec:
  selector:
    app: gau-account-service
  ports:
    - protocol: HTTP
      port: 8888
      targetPort: 8080
---

apiVersion: v1
kind: Ingress
metadata:
  name: gau-backend-ingress
  namespace: gau-{ENV}-env
#  annotations:
#    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app: gau-platform
    env: ${ENV}
spec:
  ingressClassName: nginx
  rules:
    - host: {INGRESS_HOST}
      http:
        paths:
          - path: /api/account
            pathType: Prefix
            backend:
              service:
                name: gau-account-service
                port:
                  number: 8888
---