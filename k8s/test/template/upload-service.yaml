apiVersion: v1
kind: ConfigMap
metadata:
  name: gau-upload-config
  namespace: gau-${ENV}-env
  labels:
    app: gau-platform
    env: ${ENV}
  data:
    REDIS_ADDRESS: ${REDIS_ADDRESS}
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    REDIS_DB: ${REDIS_DB}
    CLOUDFLARE_R2_ENDPOINT: ${CLOUDFLARE_R2_ENDPOINT}
    CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID}
    CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gau-upload-service
  namespace: gau-${ENV}-env
  labels:
    app: gau-platform
    env: ${ENV}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gau-upload-service
  template:
    metadata:
      labels:
        app: gau-upload-service
    spec:
      containers:
        - name: gau-upload-service
          image: tnqbao/gau-upload-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gau-upload-config
#          command: [ "/app/entrypoint.sh", "api" ]
#          resources:
#            requests:
#              memory: "512Mi"
#              cpu: "0.5"
#            limits:
#              memory: "1Gi"
#              cpu: "2"
---

apiVersion: v1
kind: Service
metadata:
  name: gau-upload-service
  namespace: gau-${ENV}-env
  labels:
    app: gau-platform
    env: ${ENV}
spec:
  selector:
    app: gau-upload-service
  ports:
    - protocol: TCP
      port: 8888
      targetPort: 8080
---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gau-backend-ingress
  namespace: gau-${ENV}-env
#  annotations:
#    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app: gau-platform
    env: ${ENV}
spec:
  ingressClassName: nginx
  rules:
    - host: ${INGRESS_HOST}
      http:
        paths:
          - path: /api/upload
            pathType: Prefix
            backend:
              service:
                name: gau-upload-service
                port:
                  number: 8888
---