apiVersion: v1
kind: ConfigMap
metadata:
  name: gau-account-config
  namespace: gau-${ENV}-env
  labels:
    app: gau-platform
    env: ${ENV}
  data:
    PGPOOL_HOST: ${PGPOOL_HOST}
    PGPOOL_DB: "gau_account_db"
    PGPOOL_USER: "accountservice"
    PGPOOL_PASSWORD: ${POSTGRES_PASSWORD}
    PGPOOL_PORT: ${PGPOOL_PORT}
    PGPOOL_URL: "postgres://${PGPOOL_USER}:${PGPOOL_PASSWORD}@${PGPOOL_HOST}:${PGPOOL_PORT}/${PGPOOL_DB}?sslmode=disable"
    REDIS_ADDRESS: ${REDIS_ADDRESS}
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    REDIS_DB: ${REDIS_DB}
    JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    JWT_ALGORITHM: ${JWT_ALGORITHM}
    JWT_EXPIRE: ${JWT_EXPIRE}
    GLOBAL_DOMAIN: ${GLOBAL_DOMAIN}
    ALLOWED_DOMAINS: ${ALLOWED_DOMAINS}
    # RABBITMQ_HOST: ${RABBITMQ_HOST}
    # RABBITMQ_PORT: ${RABBITMQ_PORT}
    # RABBITMQ_USER: ${RABBITMQ_USER}
    # RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gau-account-service
  namespace: gau-${ENV}-env
  labels:
    app: gau-platform
    env: ${ENV}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gau-account-service
  template:
    metadata:
      labels:
        app: gau-account-service
    spec:
      containers:
        - name: gau-account-service
          image: tnqbao/gau-account-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gau-account-config
#          command: [ "/app/entrypoint.sh", "api" ]
#          resources:
#            requests:
#              memory: "512Mi"
#              cpu: "0.5"
#            limits:
#              memory: "1Gi"
#              cpu: "2"
---

apiVersion: v1
kind: Service
metadata:
  name: gau-account-service
  namespace: gau-${ENV}-env
  labels:
    app: gau-platform
    env: ${ENV}
spec:
  selector:
    app: gau-account-service
  ports:
    - protocol: TCP
      port: 8888
      targetPort: 8080
---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gau-backend-ingress
  namespace: gau-${ENV}-env
#  annotations:
#    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app: gau-platform
    env: ${ENV}
spec:
  ingressClassName: nginx
  rules:
    - host: ${INGRESS_HOST}
      http:
        paths:
          - path: /api/account
            pathType: Prefix
            backend:
              service:
                name: gau-account-service
                port:
                  number: 8888
---