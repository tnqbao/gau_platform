upstream gau_account_service {
    least_conn;
    server gau-account-service:8080;
    server gau-account-service-backup:8080 backup;
}

server {
    listen 80;
    server_name api.daudoo.com;

    location /api/account {
        limit_req zone=one burst=10 nodelay;
        proxy_pass http://gau_account_service;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }

#    location /api/validation {
#        limit_req zone=one burst=10 nodelay;
#        proxy_pass http://gau_validation_service;
#        proxy_redirect off;
#        proxy_set_header X-Real-IP $remote_addr;
#        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#        proxy_set_header Host $host;
#    }

    location /api/gauflix {
        limit_req zone=one burst=10 nodelay;
        proxy_pass http://gau-phim-backend:8083;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }

    # Uncomment the following block if you want to enable the gau_truyen service

#     location /api/gautruyen {
#         limit_req zone=one burst=10 nodelay;
#         proxy_pass http://gau_truyen_backend;
#         proxy_redirect off;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header Host $host;
#     }

    location / {
        return 404;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self';" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
